name: IBM Cloud portability CI

on:
  pull_request:
  push:
    branches:
      - codex/ibm-cloud-portability-v6

permissions:
  contents: read

concurrency:
  group: ibm-cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test current platform
        run: npm test

      - name: Build standalone IBM runtime
        run: npm run build:ibm

      - name: Build container
        run: docker build --tag watson-cdi:${{ github.sha }} .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/ibm-cloud
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
